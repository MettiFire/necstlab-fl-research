[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-benchmark"
version = "1.0.0"
description = "Benchmark Federated Learning: Bagging vs Cyclic vs NVIDIA FLARE"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "NECSTLab - Polimi LS2"}
]
dependencies = [
    # Core Federated Learning Frameworks
    "flwr[simulation]>=1.13.0",
    "nvflare>=2.4.0",
    
    # Machine Learning Libraries
    "xgboost>=2.0.0,<3.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "catboost>=1.2.0",
    
    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Visualization & Analysis
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "plotly>=5.14.0",
    
    # Performance Profiling
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
    "memory-profiler>=0.61.0",
    
    # Configuration & Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

# ===== FLOWER APP CONFIG (DEFAULT) =====
[tool.flwr.app]
publisher = "necstlab-polimi"

[tool.flwr.app.components]
serverapp = "benchmarks.flower_cyclic.server:app"
clientapp = "benchmarks.flower_cyclic.client:app"

[tool.flwr.app.config]
train-method = "cyclic"
num-server-rounds = 10
fraction-train = 1.0
fraction-evaluate = 1.0
local-epochs = 5
test-fraction = 0.2
seed = 42

# XGBoost parameters
objective = "reg:squarederror"
max-depth = 6
learning-rate = 0.1
subsample = 0.8
colsample-bytree = 0.8

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 9

# ===== BENCHMARK SETTINGS =====
[tool.benchmark]
metrics = [
    "training_time",
    "communication_time",
    "aggregation_time",
    "mae",
    "rmse",
    "bytes_sent",
]
num_runs = 3
save_models = true
save_logs = true
verbose = true
